name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # test_option_chain 需要真实 OpenD 连接，与 Makefile 的 make test 保持一致排除
      - name: Run tests
        run: pytest tests/ -q --ignore=tests/test_option_chain.py
