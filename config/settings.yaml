trading:
  default_qty: 1
  max_slippage_pct: 5
  max_price_per_contract: 2.0
  daily_max_orders: 10
  enabled: true

filters:
  keywords:
    - "$alert"
    - "Lotto"
    - "enrich"
  ignore_keywords:
    - "closed"
    - "stopped"
    - "trim"

logging:
  level: INFO
  rotation: "1 day"
  retention: "30 days"
